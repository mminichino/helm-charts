apiVersion: v1
kind: Service
metadata:
  name: {{ include "couchbase-cng.fullname" . }}
  namespace: {{ include "couchbase-cng.namespace" . }}
  labels:
    {{- include "couchbase-cng.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: protostellar
      port: {{ .Values.service.ports.data }}
      targetPort: protostellar
      protocol: TCP
    - name: data-api
      port: {{ .Values.service.ports.dapi }}
      targetPort: data-api
      protocol: TCP
    - name: web
      port: {{ .Values.service.ports.web }}
      targetPort: web
      protocol: TCP
  selector:
    {{- include "couchbase-cng.selectorLabels" . | nindent 4 }}
